name: CI

on:
  pull_request:
  push:
    branches: [3.x]

jobs:
  build:
    name: Test (PHP ${{ matrix.php }}, Symfony ${{ matrix.sf_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        strategy: ['highest']
        sf_version: ['6.*', '7.*']
        include:
          - php: '8.4'
            sf_version: '7.*'
          - php: '8.4'
            sf_version: '8.*'
    container:
      image: php:${{ matrix.php }}-cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: apt-get update -q && apt-get install -yq git unzip zip

      - name: Install Composer
        run: curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - name: Configure Composer plugins
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-interaction symfony/flex

      - name: Download dependencies
        env:
          SYMFONY_REQUIRE: ${{ matrix.sf_version }}
          COMPOSER_ALLOW_SUPERUSER: 1
        run: composer update --no-interaction --prefer-dist --optimize-autoloader ${{ matrix.strategy == 'lowest' && '--prefer-lowest' || '' }}

      - name: Run tests
        run: ./vendor/bin/phpunit
